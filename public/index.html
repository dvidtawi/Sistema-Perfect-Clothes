<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosel Sis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <main class="shell">
      <header class="app-header">
        <div class="brand-block">
          <img class="brand-logo" src="/img/logo.png" alt="Perfect Clothes" />
          <div>
            <div class="system-name">Sistema de Registros</div>
            <p class="welcome">Bienvenido, Rossell</p>
          </div>
        </div>
        <button class="hero-btn hero-btn-accent" type="button" data-nav="export">
          Exportar
        </button>
      </header>

      <section id="consult-section" class="panel section">
        <div class="section-head">
          <div>
            <p class="eyebrow">Panel principal</p>
          </div>
        </div>

        <div class="consult-layout">
          <div class="consult-main">
            <div class="tabs">
              <button class="tab active" data-tab="sales">Ventas / pedidos</button>
              <button class="tab" data-tab="purchase">Compras</button>
              <button class="tab" data-tab="production">Produccion</button>
              <button class="tab" data-tab="products">Productos</button>
              <button class="tab" data-tab="clients">Clientes</button>
            </div>

            <div class="consult-toolbar" id="consult-toolbar"></div>

            <div class="subtabs">
              <button class="chip active" data-sale-filter="all">Todo</button>
              <button class="chip" data-sale-filter="sale">Ventas</button>
              <button class="chip" data-sale-filter="order">Pedidos</button>
            </div>

            <div id="table-area" class="table-wrap"></div>
          </div>
        </div>
      </section>

      <section id="export-section" class="panel section hidden">
        <div class="section-head">
          <div>
            <p class="eyebrow">Exportar</p>
            <h2>Movimientos en Excel</h2>
          </div>
          <button class="ghost" type="button" data-nav="consult">Volver a consultas</button>
          <p class="muted">
            El reporte usa exactamente las columnas solicitadas y descarga un
            archivo .xlsx.
          </p>
        </div>

        <form id="export-form" class="export-form">
          <label class="field">
            <span>Desde</span>
            <input name="from" class="date-input" data-date required />
          </label>
          <label class="field">
            <span>Hasta</span>
            <input name="to" class="date-input" data-date required />
          </label>
          <button type="submit" class="primary">Descargar Excel</button>
        </form>
      </section>
    </main>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-card">
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
